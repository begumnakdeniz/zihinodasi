<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bağlantı – Zihin Odası</title><style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222}h1{color:#1c1830}a{color:#6a4fc2}footer{margin-top:40px;font-size:14px;color:#777}code{background:#f2f2f2;padding:2px 6px;border-radius:4px;word-break:break-all}</style></head><body>
<h1>TikTok bağlantısı</h1>
<div id="out"><p>Bu sayfa TikTok izninden sonra açılır.</p></div>
<script>
const p=new URLSearchParams(location.search);const o=document.getElementById('out');
if(p.get('code')){o.innerHTML='<p>İzin verildi ✅ Bu adresin tamamını kopyalayıp <b>tiktok_auth.py</b> penceresine yapıştır:</p><p><code id="u"></code></p><button id="b">Adresi kopyala</button>';
document.getElementById('u').textContent=location.href;
document.getElementById('b').onclick=()=>{navigator.clipboard.writeText(location.href);document.getElementById('b').textContent='Kopyalandı ✓';};}
else if(p.get('error')){o.innerHTML='<p>Hata: <code></code></p>';o.querySelector('code').textContent=p.get('error')+' '+(p.get('error_description')||'');}
</script></body></html>
